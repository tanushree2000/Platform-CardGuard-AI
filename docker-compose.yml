services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cardguard
      POSTGRES_PASSWORD: cardguard
      POSTGRES_DB: cardguard
    ports: ["5432:5432"]

  api:
    build: ./services/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cardguard:cardguard@postgres:5432/cardguard
    ports: ["8000:8000"]
    depends_on: [postgres]

  web:
    build: ./apps/web
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
